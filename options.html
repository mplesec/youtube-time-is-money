<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YT Money settings</title>
    <style>
      :root { --yt-red: #ff0000; --bg: #0f0f0f; --surface: #272727; --text: #f1f1f1; --muted: #aaa; }
      html, body { margin: 0; }
      body {
        font-family: Roboto, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        width: 320px;
        padding: 20px 22px;
        box-sizing: border-box;
      }
      h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; }
      h2 .yt { color: var(--yt-red); }
      label { display: block; margin: 16px 0 6px; font-weight: 500; font-size: 13px; color: var(--muted); }
      input, select {
        width: 100%; padding: 10px 12px; font-size: 15px; box-sizing: border-box;
        background: var(--surface); color: var(--text);
        border: 1px solid #3f3f3f; border-radius: 8px; outline: none;
      }
      input:focus, select:focus { border-color: var(--yt-red); }
      #saved { color: var(--yt-red); height: 18px; margin-top: 14px; font-size: 13px; font-weight: 500; }
    </style>
  </head>
  <body>
    <h2><span class="yt">YT</span> Money</h2>
    <label for="rate">How much you earn per hour</label>
    <input id="rate" type="number" min="0" step="0.5" />
    <label for="currency">Currency</label>
    <select id="currency">
      <option value="EUR">Euro (€)</option>
      <option value="USD">Dollar ($)</option>
    </select>
    <div id="saved"></div>
    <script src="options.js"></script>
  </body>
</html>
